<div class="kiosk-container container my-0">
    
    <div class="container d-flex align-items-center justify-content-center text-center py-3 header-center">
            <div class="me-3">
                <img src="images/NFC logo.png" alt="Nitte Food Canteen logo" class="site-logo-large" />
            </div>
            <div class="site-brand ms-3">
                <h1 class="accent-heading" style="font-family: 'Bebas Neue', sans-serif;">Nitte Food Canteen</h1>
                <small class="text-muted">Self-service Kiosk</small>
            </div>
    </div>

                <div id="promoCarousel" class="carousel slide mb-5" data-bs-ride="carousel" data-bs-interval="3000">
        <div class="carousel-inner rounded-3 shadow-lg">
            <div ng-repeat="promo in promotions"
                class="carousel-item p-4 {{ promo.color }} {{ $index === 0 ? 'active' : '' }}">
            <div class="text-center py-3">
                <h2 class="display-5 fw-bold">{{ promo.title }}</h2>
                <p class="lead">{{ promo.subtitle }}</p>
            </div>
            </div>
        </div>
        </div>


            <div class="card-body">

                <h1 class="fw-bold hero-title-large mb-2 text-center">ORDER HERE</h1>
                <h2 class="fw-bold hero-title-large mb-3 text-center">TO SKIP THE QUEUE</h2>
                <p class="lead text-muted hero-subtitle mb-4 text-center">Fast, contactless ordering for students and staff.</p>

            <div class="hero-cta">
                <div class="cta-option" ng-click="dineIn()">
                    <img src="images/dine in.png" alt="Dine in" class="clickable-image" />
                    <div class="cta-label">Dine In</div>
                </div>

                <div class="cta-option" ng-click="takeAway()">
                    <img src="images/take_away.png" alt="Take away" class="clickable-image" />
                    <div class="cta-label">Take Away</div>
                </div>
            </div>

            </div>

</div>
