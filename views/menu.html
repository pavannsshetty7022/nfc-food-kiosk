<div class="container-fluid bg-white shadow-sm sticky-top">
        <div class="kiosk-container container py-3 d-flex justify-content-between align-items-center">
            <div>
                <h2 class="m-0 page-title"> Menu</h2>
                <small class="text-muted">Choose your favourites</small>
            </div>
            <button class="btn btn-lg btn-outline-danger shadow" ng-click="goToCart()">
                <i class="bi bi-cart4 me-2"></i>
                View Cart ({{ $root.cart.length }})
            </button>
        </div>

    <div class="kiosk-container container px-0">
        <nav class="nav nav-pills nav-fill category-nav overflow-auto flex-nowrap pb-2 mb-3">
            <a class="nav-link text-nowrap"
            ng-class="{ 'active': selectedCategory === category }"
            ng-click="selectCategory(category)"
            href="#"
            ng-repeat="category in categories">
                {{ category }}
            </a>
        </nav>
    </div>
</div>

<div class="kiosk-container container mt-4">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 pb-5">
        
        <div class="col" ng-repeat="item in menuItems | filter: filterByCategory">
            <div class="card menu-card h-100">
                
                <img ng-src="{{ item.imageUrl }}" class="card-img-top" alt="{{ item.name }}">
                
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title card-title-nfc" style="text-align: center;">{{ item.name }}</h5>
                    <p class="card-text text-muted flex-grow-1" style="text-align: center;">{{ item.description }}</p>
                    
                    <div class="mt-auto pt-1">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="card-price-nfc">₹{{ item.price | number:2 }}</span>
                            
                            <button class="btn btn-nfc-primary btn-sm" style="padding: 10px; font-size: 18px;"   ng-click="addToCart(item)">
                                <i class="bi bi-cart-plus me-1" style="font-size: 18px;"></i> Add
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-12 text-center my-5" ng-if="(menuItems | filter: filterByCategory).length == 0">
            <p class="lead text-danger">No items found in the **{{ selectedCategory }}** category.</p>
        </div>

    </div>
</div>
